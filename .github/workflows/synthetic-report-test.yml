name: Synthetic Report Test

on:
  workflow_dispatch:
  push:
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/synthetic-report-test.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/synthetic-report-test.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests on invented data
        run: python -m unittest discover -s tests -v
      - name: Create synthetic report
        run: |
          python -m src.process_report --input tests/fixtures/synthetic_daily.csv --output /tmp/breathe-summary.csv
          test -s /tmp/breathe-summary.csv
